service: Jornada-Matte
frameworkVersion: '^3.38'
configValidationMode: error

provider:
  name: aws
  runtime: python3.11
  profile: matte
  region: us-east-1
  httpApi:
    cors: true

functions:
  jornada-matte:
    handler: handler.webhook
    timeout: 25
    events:
      - httpApi:
          path: /webhook
          method: post

  checker:
    handler: handler.check_stages
    timeout: 300
    events:
      - schedule: cron(0/10 11-21 ? * MON-FRI *)
    
plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    pipCmdExtraArgs:
      - '--platform'
      - 'manylinux2014_x86_64'
      - '--python-version'
      - '3.11'
      - '--only-binary=:all:'
    slim: true